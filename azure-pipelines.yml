trigger:
  - main

pool:
  vmImage: "ubuntu-latest"

variables:
  solution: "**/*.sln"
  buildPlatform: "Any CPU"
  buildConfiguration: "Release"
  nodeVersion: "22.x"
  majorVersion: 2
  minorVersion: 0
  patchVersion: $[counter(format('{0}.{1}', variables['majorVersion'], variables['minorVersion']), 0)]
  version: $(majorVersion).$(minorVersion).$(patchVersion)

name: $(version)

steps:
  - task: NodeTool@0
    displayName: "Use Node.js $(nodeVersion)"
    inputs:
      versionSpec: "$(nodeVersion)"

  - task: UseDotNet@2
    inputs:
      packageType: "sdk"
      version: "10.0.x"

  - task: DotNetCoreCLI@2
    displayName: 'Restore packages'
    inputs:
      command: 'restore'
      projects: '$(solution)'

  - task: DotNetCoreCLI@2
    displayName: 'Build solution'
    inputs:
      command: 'build'
      projects: '$(solution)'
      arguments: '--configuration $(buildConfiguration) --no-restore'

  - task: DotNetCoreCLI@2
    displayName: 'Run tests'
    inputs:
      command: 'test'
      projects: '**/*Tests.csproj'
      publishTestResults: false
      arguments: '--configuration $(buildConfiguration) --no-build --logger trx --results-directory "$(Agent.TempDirectory)"'

  - task: PublishTestResults@2
    displayName: 'Publish test results'
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: 'VSTest'
      testResultsFiles: '**/*.trx'
      searchFolder: '$(Agent.TempDirectory)'
      mergeTestResults: true
      failTaskOnFailedTests: true

  - task: DotNetCoreCLI@2
    displayName: 'Pack NuGet package'
    inputs:
      command: "pack"
      packagesToPack: "Htmx.Components.csproj"
      versioningScheme: "byBuildNumber"
      configuration: "$(buildConfiguration)"

  - task: PublishBuildArtifacts@1
    displayName: 'Publish artifacts'
    inputs:
      PathtoPublish: "$(Build.ArtifactStagingDirectory)"
      ArtifactName: "drop"
      publishLocation: "Container"

  - task: DotNetCoreCLI@2
    displayName: 'Push to NuGet.org'
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    inputs:
      command: 'custom'
      custom: 'nuget'
      arguments: 'push $(Build.ArtifactStagingDirectory)/**/*.nupkg --api-key $(NUGET_API_KEY) --source https://api.nuget.org/v3/index.json --skip-duplicate'
    env:
      NUGET_API_KEY: $(NUGET_API_KEY)
